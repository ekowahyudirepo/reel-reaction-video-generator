name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit test
        run: ./gradlew testDebugUnitTest --stacktrace

      # Opsional: bila secret keystore diisi, APK ditandatangani dengan key tetap.
      - name: Siapkan keystore rilis
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK rilis
        run: ./gradlew assembleRelease --stacktrace

      - name: Beri nama APK
        id: apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/reel-reaction-v${VERSION_NAME}.apk"
          echo "path=dist/reel-reaction-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: reel-reaction-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Setiap push ke main otomatis menerbitkan Release berisi APK siap unduh.
      - name: Terbitkan GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Reel Reaction v${{ env.VERSION_NAME }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
